server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: aegis-console
  datasource:
    # 使用文件模式持久化，保证重启后事件与基线不丢失，
    # 也使哈希链的连续性得以跨重启验证
    url: jdbc:h2:file:./data/aegis;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: true

logging:
  level:
    root: INFO
    com.aegis: INFO
    org.hibernate.SQL: WARN
